<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ml5.js handPose p5 Webcam Example</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <script>
      let handPose; //mod.
      let video;
      let hands = []; 
      let pinch = 0;

      function preload() {
        handPose = ml5.handPose();
      }

      function setup() {
        createCanvas(640, 480);
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        //Iniciar detector de manos
        handPose.detectStart(video, gotHands);
      }

      function draw() {

        image(video, 0, 0, width, height);

        if (hands.length > 1) {
          //Si al menos dos manos fueron detectadas..
          // Obtener los dedos índices de ambas manos
          let index1 = hands[0].index_finger_tip;
          let index2 = hands[1].index_finger_tip;

          stroke(0, 255, 0);
          strokeWeight(4);
          line(index1.x, index1.y, index2.x, index2.y); // dibuja la línea entre índices
        }
      }

      function gotHands(results) {
        hands = results;
      }
    </script>
  </body>
</html>
