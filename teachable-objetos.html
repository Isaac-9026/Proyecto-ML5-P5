<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachable Machine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/addons/p5.dom.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="css/modules.css" />
  </head>
  <body>
    <div>
      <div class="module-header">
        <h1>Teachable Machine</h1>
        <p>
          Detección en tiempo real de: Botella, Billetera, Control Remoto y
          Plumón.
        </p>
      </div>

      <div>
        <div>
          <div id="canvas-container"></div>
        </div>
        <div>
          <div>
            <span>Objeto detectado: </span>
            <span class="info-value" id="objetoDetectado"> Esperando... </span>
          </div>
          <div>
            <span>Confianza: </span>
            <span class="info-value" id="confidence"> 0% </span>
          </div>
          <div>
            <span>Estado: </span>
            <span class="info-value" id="status"> Analizando... </span>
          </div>
          <div>
            <span>Síntesis de voz: </span>
            <span class="info-value"> Activada </span>
          </div>
        </div>
      </div>
    </div>

    <script>
      let classifier;
      let video;
      let ultimaEtiquetaHablada = "";
      const imageModelURL = "./models/";

      function preload() {
        classifier = ml5.imageClassifier(imageModelURL + "model.json");
      }

      function setup() {
        const canvas = createCanvas(640, 480);
        canvas.parent("canvas-container");
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        classifyVideo();
      }

      function draw() {
        background(0);
        push();// Guardar estado del canvs
        translate(width, 0); //Invertir
        scale(-1, 1);
        image(video, 0, 0, width, height); 

        pop();
      }

      function classifyVideo() {
        classifier.classify(video, goResult);
      }

      function goResult(error, results) {
        if (error) {
          console.error(error);
          return;
        }

        const item = results[0];
        const confidence = Math.round(item.confidence * 100);
        // Conectar con los elementos HTML
        const objectElement = document.getElementById("objetoDetectado");
        const confidenceElement = document.getElementById("confidence");
        const statusElement = document.getElementById("status");

        if (confidence >= 50) {
          objectElement.textContent = item.label;
          confidenceElement.textContent = confidence + "%";
          statusElement.textContent = "Detectado";

          // Si es una nueva detección, pronunciarla
          if (ultimaEtiquetaHablada !== item.label) {
            const speech = new SpeechSynthesisUtterance(
              `Se detectó ${item.label} con ${confidence} por ciento de confianza`,
            );

            speech.lang = "es-PE";

            // Cancelar cualquier voz pendiente y reproducir
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(speech);

            // Guardar la última etiqueta hablada
            ultimaEtiquetaHablada = item.label;
          }
        } else {
          objectElement.textContent = "No identificado";
          confidenceElement.textContent = confidence + "%";
          statusElement.textContent = "Confianza insuficiente";
          ultimaEtiquetaHablada = "";
        }

        classifyVideo();
      }
    </script>
  </body>
</html>
