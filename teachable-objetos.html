<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reconocimiento con Cámara</title>

    <!-- CDN obtenidos de TEACHABLE MACHINE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/addons/p5.dom.min.js"></script>
    <!-- ML5.js -->
    <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="results-container">
      <h2>Salida</h2>
      <div id="results"></div>
    </div>

    <script>
      let classifier;
      let imageModelURL = "./models/";

      let video;
      let lastSpokenLabel = "";

      function preload() {
        classifier = ml5.imageClassifier(imageModelURL + "model.json");
      }

      function setup() {
        createCanvas(320, 260);

        video = createCapture(VIDEO);
        video.size(320, 260);
        video.hide();

        classifyVideo();
      }

      function draw() {
        background(255);

        push();
        translate(width, 0);
        scale(-1, 1);
        image(video, 0, 0);
        pop();
      }

      function classifyVideo() {
        classifier.classify(video, goResult);
      }

      function goResult(error, result) {
        if (error) {
          console.error(error);
          return;
        }

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        const item = result[0];
        const percentage = Math.round(item.confidence * 100);

        const resultItem = document.createElement("div");
        resultItem.className = "result-item";

        const label = document.createElement("div");
        label.className = "result-label";
        label.textContent = `${item.label} - ${percentage}%`;

        resultItem.appendChild(label);
        resultsDiv.appendChild(resultItem);

        if (percentage >= 50) {
          if (lastSpokenLabel !== item.label) {
            const message = new SpeechSynthesisUtterance(
              `Se encontró ${item.label} con ${percentage} por ciento de confianza`,
            );
            message.lang = "es-PE";
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(message);
            lastSpokenLabel = item.label;
          }
        } else {
          lastSpokenLabel = "";
        }

        classifyVideo();
      }
    </script>
  </body>
</html>
